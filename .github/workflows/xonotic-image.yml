name: Build Xonotic Image

on:
  push:
    branches: [ main ]
    paths:
      - 'Containerfile'
      - '.github/workflows/xonotic-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: |
          podman build \
            -t ghcr.io/${{ github.repository_owner }}/xonotic:latest \
            -f Containerfile \
            .

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push image
        run: |
          podman push ghcr.io/${{ github.repository_owner }}/xonotic:latest
